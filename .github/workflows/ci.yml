name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Environment check
        run: python convert.py --doctor

      - name: Tests (unit + end-to-end smoke)
        run: python -m pytest tests -q

      - name: Convert the example decks
        run: |
          python convert.py examples/sample-deck.html -o /tmp/sample-deck.pptx
          python convert.py examples/sample-report.html -o /tmp/sample-report.pptx
          ls -l /tmp/*.pptx
